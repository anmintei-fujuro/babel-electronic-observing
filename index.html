<!doctype html>
<html lang="ja">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>星空をいっしょに｜バベル三世 電子観望</title>
<style>
:root{font-family:system-ui,sans-serif;color:#eaf0fa;background:#080c14}*{box-sizing:border-box}
body{margin:0}header,footer,.info{max-width:1440px;margin:auto;padding:20px 24px}
header{display:flex;align-items:center;justify-content:space-between;gap:16px}h1{font-size:20px;margin:4px 0;font-weight:600}
.eyebrow{font-size:11px;letter-spacing:.18em;color:#9caeca}.badge{font-size:12px;border:1px solid #304557;border-radius:20px;padding:7px 12px;color:#a9dcc6;white-space:nowrap}
.picture{background:#020407;min-height:40vh;display:grid;place-items:center;border-block:1px solid #1a2535;position:relative}
img{display:block;max-width:100%;max-height:76vh;object-fit:contain}img:not([src]){display:none}#message{padding:90px 20px;color:#a7b7cc}
.info{display:flex;justify-content:space-between;align-items:center;gap:24px}.target{font-size:18px;margin:0 0 8px}.detail,footer{font-size:13px;color:#9daec5;line-height:1.8}
button{color:#eaf0fa;background:#182438;border:1px solid #34485e;border-radius:8px;padding:10px 16px;cursor:pointer}
footer{border-top:1px solid #1a2535}.numbers{color:#ecf3fe;font-variant-numeric:tabular-nums}
@media(max-width:600px){header,.info,footer{padding:16px}h1{font-size:17px}.info{align-items:flex-start;flex-direction:column}.badge{font-size:10px;padding:6px 8px}img{max-height:70vh}}
</style>
<header><div><div class="eyebrow">TURRIS BABEL III · NIGHT SKY</div><h1>星空をいっしょに</h1></div><span class="badge" id="status">画像を読み込み中</span></header>
<main>
<div class="picture"><div id="message" role="status">望遠鏡から届いた画像を読み込んでいます。</div><img id="frame" alt="望遠鏡で撮影した最新の累積画像"></div>
<div class="info"><div><p class="target" id="target">電子観望</p><div class="detail"><span class="numbers" id="integration"></span><br><span id="observed"></span></div></div><button id="share">リンクを共有</button></div>
</main>
<footer>撮影した画像を少しずつ重ね、淡い星や銀河を浮かび上がらせています。画像は約1分間隔で送信します。公開への反映には遅れが生じることがあります。<br>撮影や通信が止まった場合は、最後に届いた実写を表示します。</footer>
<script>
const dataURL='https://raw.githubusercontent.com/anmintei-fujuro/babel-electronic-observing/live/latest.json';let lastImage='',lastCapture='';
const $=id=>document.getElementById(id);
function captureDate(text){return new Date(text.replace(/ UTC$/,'Z'));}
function updateBadge(){const date=captureDate(lastCapture);$('status').textContent=Number.isFinite(date.getTime())&&Date.now()-date.getTime()<180000?'電子観望・自動更新':'最終画像を表示';}
async function update(){try{
 const url=new URL(dataURL,location.href);url.searchParams.set('t',Math.floor(Date.now()/30000));
 const response=await fetch(url,{cache:'no-store'});if(!response.ok)throw new Error('image pending');
 const s=await response.json();if(s.schema!=='babel-public-eaa-v1'||!s.image.startsWith('data:image/jpeg;base64,'))throw new Error('invalid picture');
 if(s.image_sha256!==lastImage){$('frame').src=s.image;lastImage=s.image_sha256;}
 $('message').hidden=true;$('target').textContent=s.target.replace(/ · 累積.*$/,'');
 const minutes=Number(s.integration_s)/60;
 $('integration').textContent=s.mode==='planetary_live'?'惑星の実写画像':`${s.frame_count}枚を重ね合わせ · 積算${minutes.toFixed(1)}分 · 1枚${s.exposure_s}秒`;
 lastCapture=s.observed_at;const date=captureDate(lastCapture);
 $('observed').textContent=Number.isFinite(date.getTime())?'画像の撮影時刻：'+date.toLocaleString('ja-JP',{timeZone:'Asia/Tokyo'})+' JST':'画像の撮影時刻：'+lastCapture;
 updateBadge();
 }catch(error){$('status').textContent=lastImage?'更新待ち・最終画像を表示':'画像の公開準備中';if(!lastImage)$('message').textContent='画像の公開を準備しています。自動で再接続します。';}}
$('share').onclick=async()=>{try{if(navigator.share)await navigator.share({title:document.title,url:location.href});else{await navigator.clipboard.writeText(location.href);$('share').textContent='リンクをコピーしました';}}catch(error){$('share').textContent='このページのURLを共有';}};
update();setInterval(update,30000);
</script>
</html>
